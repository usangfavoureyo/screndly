<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Screndly - Trailer Management PWA</title>
  
  <!-- CRITICAL: Block WebAssembly BEFORE any other scripts load -->
  <script>
    (function() {
      'use strict';
      
      console.log('[WASM Blocker] Initializing ULTIMATE blocking system...');
      
      // STEP 0: Unregister ALL service workers first (prevents caching issues)
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister().then(function() {
              console.log('[WASM Blocker] Unregistered service worker');
            });
          }
        });
        
        // Also clear all caches
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (let name of names) {
              caches.delete(name);
              console.log('[WASM Blocker] Deleted cache:', name);
            }
          });
        }
      }
      
      // Flag to control WebAssembly access
      let allowWebAssembly = false;
      window.__enableWebAssembly = function() { 
        console.log('[WASM Blocker] WebAssembly ENABLED');
        allowWebAssembly = true; 
        // Restore WebAssembly if it was deleted
        if (!window.WebAssembly && window.__originalWebAssembly) {
          window.WebAssembly = window.__originalWebAssembly;
          console.log('[WASM Blocker] WebAssembly API RESTORED');
        }
      };
      window.__disableWebAssembly = function() { 
        console.log('[WASM Blocker] WebAssembly DISABLED');
        allowWebAssembly = false; 
        // Completely delete WebAssembly
        if (window.WebAssembly) {
          window.__originalWebAssembly = window.WebAssembly;
          delete window.WebAssembly;
        }
      };

      // 1. Intercept fetch requests to block .wasm files
      const originalFetch = window.fetch;
      window.fetch = function() {
        const args = Array.prototype.slice.call(arguments);
        const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url) || '';
        
        // Block .wasm files unless explicitly enabled
        if (url.includes('.wasm') || url.includes('ffmpeg') || url.includes('WebAssembly')) {
          if (!allowWebAssembly) {
            console.log('[WASM Blocker] ❌ Blocked fetch:', url);
            // Return a rejected promise that looks like a network error
            return Promise.reject(Object.assign(new Error('WebAssembly blocked'), { name: 'NetworkError' }));
          }
          console.log('[WASM Blocker] ✅ Allowed fetch:', url);
        }
        
        return originalFetch.apply(this, args);
      };

      // 2. Store original WebAssembly but keep it available (don't delete it)
      if (typeof WebAssembly !== 'undefined') {
        // Store the original
        window.__originalWebAssembly = window.WebAssembly;
        
        // Wrap WebAssembly methods instead of deleting
        const originalMethods = {
          compile: WebAssembly.compile,
          compileStreaming: WebAssembly.compileStreaming,
          instantiate: WebAssembly.instantiate,
          instantiateStreaming: WebAssembly.instantiateStreaming,
        };

        // Wrap non-streaming methods
        const wrapMethod = function(method) {
          return function() {
            if (!allowWebAssembly) {
              return Promise.reject(new Error('WebAssembly blocked'));
            }
            return method.apply(WebAssembly, arguments);
          };
        };

        // Wrap streaming methods (pass through directly when enabled)
        const wrapStreamingMethod = function(method) {
          return function() {
            if (!allowWebAssembly) {
              return Promise.reject(new Error('WebAssembly blocked'));
            }
            // Pass through directly to avoid interfering with streaming
            return method.apply(WebAssembly, arguments);
          };
        };

        WebAssembly.compile = wrapMethod(originalMethods.compile);
        WebAssembly.compileStreaming = wrapStreamingMethod(originalMethods.compileStreaming);
        WebAssembly.instantiate = wrapMethod(originalMethods.instantiate);
        WebAssembly.instantiateStreaming = wrapStreamingMethod(originalMethods.instantiateStreaming);
        
        console.log('[WASM Blocker] WebAssembly API wrapped (not deleted)');
      }

      // 3. Global error handlers with AGGRESSIVE suppression
      const isWasmError = function(msg) {
        if (!msg) return false;
        const str = String(msg).toLowerCase();
        return str.includes('webassembly') || 
               str.includes('wasm') || 
               str.includes('compilation aborted') ||
               str.includes('network error: error') ||
               str.includes('networkerror') ||
               (str.includes('network') && str.includes('error')) ||
               str.includes('compil') && str.includes('abort');
      };

      // Capture errors at the EARLIEST possible point
      window.addEventListener('error', function(event) {
        const errorMsg = event.message || (event.error && event.error.message) || '';
        if (isWasmError(errorMsg)) {
          console.log('[WASM Blocker] 🛡️ SUPPRESSED ERROR:', errorMsg);
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
          return false;
        }
      }, {capture: true, passive: false});

      window.addEventListener('unhandledrejection', function(event) {
        const errorMsg = (event.reason && event.reason.message) || String(event.reason) || '';
        if (isWasmError(errorMsg)) {
          console.log('[WASM Blocker] 🛡️ SUPPRESSED REJECTION:', errorMsg);
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, {capture: true, passive: false});

      // 4. Override console.error to suppress WASM errors
      const originalConsoleError = console.error;
      console.error = function() {
        const args = Array.prototype.slice.call(arguments);
        const errorString = args.join(' ');
        if (isWasmError(errorString)) {
          console.log('[WASM Blocker] 🛡️ SUPPRESSED CONSOLE.ERROR:', errorString.substring(0, 100));
          return;
        }
        originalConsoleError.apply(console, args);
      };
      
      // 5. Override console.warn too
      const originalConsoleWarn = console.warn;
      console.warn = function() {
        const args = Array.prototype.slice.call(arguments);
        const errorString = args.join(' ');
        if (isWasmError(errorString)) {
          console.log('[WASM Blocker] 🛡️ SUPPRESSED CONSOLE.WARN:', errorString.substring(0, 100));
          return;
        }
        originalConsoleWarn.apply(console, args);
      };

      console.log('[WASM Blocker] ✅✅✅ ULTIMATE blocking system initialized ✅✅✅');
      console.log('[WASM Blocker] WebAssembly global:', typeof window.WebAssembly); // Should print 'undefined'
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/App.tsx"></script>
</body>
</html>
