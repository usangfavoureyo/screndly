<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Screndly</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
    }

    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 16px;
      font-weight: 700;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    .button {
      display: inline-block;
      padding: 14px 32px;
      background: white;
      color: #667eea;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 16px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .status {
      margin-top: 40px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 14px;
    }

    .status.online {
      background: rgba(72, 187, 120, 0.3);
    }

    .status.offline {
      background: rgba(245, 101, 101, 0.3);
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 24px;
      }

      p {
        font-size: 16px;
      }

      .icon {
        width: 100px;
        height: 100px;
        font-size: 50px;
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .checking {
      animation: pulse 2s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      📡
    </div>
    
    <h1>You're Offline</h1>
    
    <p>
      Looks like you've lost your internet connection. Don't worry, we've saved your work locally.
      Check your connection and try again.
    </p>
    
    <a href="/" class="button" onclick="window.location.reload(); return false;">
      Try Again
    </a>
    
    <div id="status" class="status offline">
      <strong>Status:</strong> <span id="connection-status">Offline</span>
      <span id="checking" style="display: none;" class="checking"> - Checking...</span>
    </div>
  </div>

  <script>
    // Check connection status
    function updateStatus() {
      const statusEl = document.getElementById('status');
      const connectionStatusEl = document.getElementById('connection-status');
      const checkingEl = document.getElementById('checking');
      
      if (navigator.onLine) {
        statusEl.className = 'status online';
        connectionStatusEl.textContent = 'Online';
        checkingEl.style.display = 'none';
        
        // Auto-reload when back online
        setTimeout(() => {
          window.location.href = '/';
        }, 1000);
      } else {
        statusEl.className = 'status offline';
        connectionStatusEl.textContent = 'Offline';
        checkingEl.style.display = 'none';
      }
    }

    // Listen for online/offline events
    window.addEventListener('online', updateStatus);
    window.addEventListener('offline', updateStatus);

    // Check periodically
    setInterval(() => {
      const checkingEl = document.getElementById('checking');
      checkingEl.style.display = 'inline';
      
      fetch('/manifest.json', { cache: 'no-store' })
        .then(() => {
          if (!navigator.onLine) {
            // Force online event
            window.dispatchEvent(new Event('online'));
          }
        })
        .catch(() => {
          // Still offline
          checkingEl.style.display = 'none';
        });
    }, 5000);

    // Initial check
    updateStatus();
  </script>
</body>
</html>
