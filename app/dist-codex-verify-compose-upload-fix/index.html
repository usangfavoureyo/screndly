<body style="margin: 0; padding: 0;">
  <!-- Blocking script: apply dark mode BEFORE React loads to prevent flash -->
  <script>
    (function () {
      try {
        var theme = null;
        var settings = localStorage.getItem('screndlySettings');
        if (settings) {
          try {
            var parsedSettings = JSON.parse(settings);
            if (typeof parsedSettings.darkMode === 'boolean') {
              theme = parsedSettings.darkMode ? 'dark' : 'light';
            }
          } catch (settingsError) {
            theme = null;
          }
        }

        if (theme !== 'dark' && theme !== 'light') {
          theme = localStorage.getItem('theme');
        }

        if (theme !== 'dark' && theme !== 'light') {
          theme = 'dark';
        }

        var isDark = theme === 'dark';
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        var colorSchemeMeta = document.querySelector('meta[name="color-scheme"]');

        document.documentElement.dataset.theme = theme;

        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
          document.body.style.backgroundColor = '#000000';
          if (themeColorMeta) themeColorMeta.setAttribute('content', '#000000');
          if (colorSchemeMeta) colorSchemeMeta.setAttribute('content', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
          document.body.style.backgroundColor = '#ffffff';
          if (themeColorMeta) themeColorMeta.setAttribute('content', '#ffffff');
          if (colorSchemeMeta) colorSchemeMeta.setAttribute('content', 'light');
        }
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
        document.body.style.backgroundColor = '#000000';
      }
    })();
  </script>
  <div id="root"></div>

  <!-- Service Worker Registration -->

</body>
