<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ec1e24" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Screndly" />
  <meta name="description"
    content="Automation dashboard for movie/TV trailer downloading, posting, and engagement through AI agents" />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json?v=4" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
  <link rel="shortcut icon" href="/icons/icon-72x72.png" />

  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />

  <title>Screndly</title>
</head>

<body style="margin: 0; padding: 0;">
  <!-- Blocking script: apply dark mode BEFORE React loads to prevent flash -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme');
        var isDark = theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.body.style.backgroundColor = '#000000';
        } else {
          document.body.style.backgroundColor = '#ffffff';
        }
      } catch (e) {
        document.body.style.backgroundColor = '#000000';
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Service Worker Registration -->

</body>

</html>
